<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MY MONEY — Aplikasi Keuangan Pribadi</title>
<meta name="description" content="MY MONEY — aplikasi pengelola keuangan pribadi: gaji, pemasukan, pengeluaran, tabungan, dan laporan. Berjalan offline sebagai PWA." />
<meta name="theme-color" content="#f4f8ff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#060a14" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="My Money" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><i data-lucide="wallet"></i></div>
      <div><div class="brand-name">MY MONEY</div><div class="brand-sub">Personal Finance</div></div>
    </div>
    <nav class="side-nav">
      <button class="nav-item" data-route="dashboard"><i data-lucide="home"></i><span>Home</span></button>
      <button class="nav-item" data-route="transactions"><i data-lucide="arrow-left-right"></i><span>Transaksi</span></button>
      <button class="nav-item" data-route="reports"><i data-lucide="chart-pie"></i><span>Laporan</span></button>
      <button class="nav-item" data-route="savings"><i data-lucide="piggy-bank"></i><span>Tabungan</span></button>
      <button class="nav-item" data-route="profile"><i data-lucide="user"></i><span>Profil</span></button>
    </nav>
    <div class="side-foot">v1.0.0 &bull; Data tersimpan lokal di perangkat</div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="brand-mobile"><div class="brand-mark sm"><i data-lucide="wallet"></i></div><span>MY&nbsp;MONEY</span></div>
      <h1 id="page-title" class="page-title">Dashboard</h1>
      <div class="topbar-actions">
        <button id="btn-theme" class="icon-btn" title="Ganti tema" aria-label="Ganti tema"><i data-lucide="moon"></i></button>
        <button id="btn-add" class="btn-primary-soft"><i data-lucide="plus"></i><span class="d-none d-sm-inline">Transaksi</span></button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>

  <nav class="bottom-nav" aria-label="Navigasi utama">
    <button class="nav-item" data-route="dashboard"><i data-lucide="home"></i><span>Home</span></button>
    <button class="nav-item" data-route="transactions"><i data-lucide="arrow-left-right"></i><span>Transaksi</span></button>
    <button class="nav-item" data-route="reports"><i data-lucide="chart-pie"></i><span>Laporan</span></button>
    <button class="nav-item" data-route="savings"><i data-lucide="piggy-bank"></i><span>Tabungan</span></button>
    <button class="nav-item" data-route="profile"><i data-lucide="user"></i><span>Profil</span></button>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/database.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/transactions.js"></script>
<script src="js/salary.js"></script>
<script src="js/savings.js"></script>
<script src="js/reports.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
